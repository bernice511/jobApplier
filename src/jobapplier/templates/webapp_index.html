<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>jobApplier - Tailor from JD</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4;
    }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2.5rem; }
    textarea {
      width: 100%; min-height: 220px; box-sizing: border-box; font-family: inherit;
      font-size: 0.95rem; padding: 0.6rem;
    }
    button {
      margin-top: 0.6rem; padding: 0.5rem 1.2rem; font-size: 0.95rem; cursor: pointer;
    }
    #tailor-result, #chat-log { margin-top: 1rem; }
    .card {
      border: 1px solid #8884; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.8rem;
    }
    .card .meta { font-weight: 600; }
    .card .sub { opacity: 0.7; font-size: 0.85rem; }
    .card a { margin-right: 1rem; }
    .error { color: #c0392b; }
    .score { font-size: 1.3rem; font-weight: 700; }
    .changes-list { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; font-size: 0.9rem; }
    mark.changed { background: #fff2a8; padding: 0 2px; border-radius: 2px; }
    .preview-box { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin-top: 0.8rem; overflow-x: auto; }
    #chat-input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    #chat-input-row input {
      flex: 1; padding: 0.5rem; font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>jobApplier</h1>

  <h2>Paste a job description</h2>
  <p>Just paste the full JD (company name included) - it'll be tailored against your master resume.</p>
  <textarea id="jd-text" placeholder="Paste the job description here..."></textarea><br>
  <button id="tailor-btn">Tailor resume</button>
  <div id="tailor-result"></div>

  <h2>Ask about past applications</h2>
  <p>e.g. "which resume did I use for Netflix" or "backend role at Google"</p>
  <div id="chat-log"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a question...">
    <button id="chat-btn">Ask</button>
  </div>

  <script>
    function fileLink(filename, label) {
      return `<a href="/files/${encodeURIComponent(filename)}" target="_blank">${label}</a>`;
    }

    function renderRecordCard(r) {
      const div = document.createElement('div');
      div.className = 'card';
      const scoreText = (r.match_score !== undefined && r.match_score !== null && r.match_score !== '')
        ? ` - Match score: ${r.match_score} / 10` : '';
      div.innerHTML = `
        <div class="meta">${r.title} @ ${r.company}${r.location ? ' - ' + r.location : ''}</div>
        <div class="sub">${r.timestamp || ''}${scoreText}</div>
        <div>${fileLink(r.resume_filename, 'Resume')} ${fileLink(r.cover_letter_filename, 'Cover letter')}</div>
      `;
      return div;
    }

    document.getElementById('tailor-btn').addEventListener('click', async () => {
      const jdText = document.getElementById('jd-text').value;
      const resultDiv = document.getElementById('tailor-result');
      resultDiv.textContent = 'Tailoring... (this calls Claude, may take a bit)';
      try {
        const resp = await fetch('/api/tailor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jd_text: jdText }),
        });
        const data = await resp.json();
        resultDiv.innerHTML = '';
        if (!resp.ok) {
          const err = document.createElement('div');
          err.className = 'error';
          err.textContent = data.error || 'Something went wrong.';
          resultDiv.appendChild(err);
          return;
        }
        resultDiv.appendChild(renderRecordCard(data));

        if (data.match_score !== undefined && data.match_score !== null) {
          const score = document.createElement('div');
          score.className = 'score';
          score.textContent = `Match score: ${data.match_score} / 10`;
          resultDiv.appendChild(score);
        }

        if (data.changes && data.changes.length) {
          const ul = document.createElement('ul');
          ul.className = 'changes-list';
          data.changes.forEach((c) => {
            const li = document.createElement('li');
            li.textContent = c;
            ul.appendChild(li);
          });
          resultDiv.appendChild(ul);
        }

        if (data.resume_preview_html) {
          const note = document.createElement('p');
          note.className = 'sub';
          note.textContent = 'Highlighted below = reworded from your master resume. Highlights are for preview only - the downloaded PDF is clean.';
          resultDiv.appendChild(note);

          const preview = document.createElement('div');
          preview.className = 'preview-box';
          preview.innerHTML = data.resume_preview_html;
          resultDiv.appendChild(preview);
        }
      } catch (e) {
        resultDiv.innerHTML = `<div class="error">${e}</div>`;
      }
    });

    document.getElementById('chat-btn').addEventListener('click', askQuestion);
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askQuestion();
    });

    async function askQuestion() {
      const input = document.getElementById('chat-input');
      const question = input.value.trim();
      if (!question) return;
      const chatLog = document.getElementById('chat-log');

      const q = document.createElement('div');
      q.innerHTML = `<strong>You:</strong> ${question}`;
      chatLog.appendChild(q);

      const resp = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await resp.json();

      if (!data.matches || data.matches.length === 0) {
        const none = document.createElement('div');
        none.textContent = "No matching applications found.";
        chatLog.appendChild(none);
      } else {
        data.matches.forEach((r) => chatLog.appendChild(renderRecordCard(r)));
      }
      input.value = '';
    }
  </script>
</body>
</html>
